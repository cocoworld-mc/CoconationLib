plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id "com.gradleup.shadow" version "9.4.2"
    id "com.vanniktech.maven.publish" version "0.36.0"
}

group = 'io.github.leralix'
version = '0.7.0'


mavenPublishing {
    // publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, true)
    // signAllPublications()
}

// signing {
//     useGpgCmd()
//     sign(publishing.publications)
// }

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven { url = "https://plugins.gradle.org/m2/" }
    gradlePluginPortal()
}

dependencies {
    // Paper API targeting Minecraft 26.1.2 / Java 25 (MC26 platform migration).
    // New coordinate scheme (26.1.2.build.N-stable) replaces the legacy -R0.1-SNAPSHOT format.
    compileOnly "io.papermc.paper:paper-api:26.1.2.build.69-stable"

    // Bukkit API on the test classpath: ConfigUtil references FileConfiguration/YamlConfiguration,
    // which the verifier must load when linking the class under test. Aligned with the compile coordinate.
    testImplementation "io.papermc.paper:paper-api:26.1.2.build.69-stable"
    // JUnit aligned via the BOM: recent enough to read Java 25 class files (ASM) and to provide
    // the JUnit Platform launcher that Gradle 9 no longer puts on the test runtime classpath implicitly.
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

shadowJar {
    relocate 'org.bstats', 'org.leralix.lib'
    archiveClassifier.set('all')
    archiveBaseName.set('CocoNationLib')
}


def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // Configure Gradle Java toolchain to request Java 25 for compilation/execution
    // This lets Gradle download/use a JDK 25 toolchain if available on the system or toolchain providers.
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // Use --release when supported to ensure consistent bytecode and API level
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

// Traitement des ressources
processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

mavenPublishing {
    coordinates("org.coco", "CocoNationLib", "0.1")

    pom {
        name = "CocoNationLib"
        description = "Minecraft plugin library"
        inceptionYear = "2025"
        url = "https://github.com/Leralix/SphereLib"
        licenses {
            license {
                name = "GNU General Public License v3.0"
                url = "https://www.gnu.org/licenses/gpl-3.0.html"
                distribution = "https://www.gnu.org/licenses/gpl-3.0.html"
            }
        }
        developers {
            developer {
                id = '78090544'
                name = 'Leralix'
                email = 'leralix98@gmail.com'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/Leralix/SphereLib.git'
            developerConnection = 'scm:git:ssh://github.com/Leralix/SphereLib.git'
            url = 'https://github.com/Leralix/SphereLib'
        }
    }
}


tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('charset', 'UTF-8')
    options.addStringOption('docencoding', 'UTF-8')
}

